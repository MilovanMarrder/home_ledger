[project]
name = "homeledger"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-telegram-bot>=21.0",
  "python-dotenv>=1.0",
]

[tool.alembic]
script_location = "alembic"
